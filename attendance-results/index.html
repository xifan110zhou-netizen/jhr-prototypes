function person(name,emp){return `<div class="person"><span class="avatar">${e(name.slice(-2))}</span><div><span class="name">${e(name)}</span><span class="sub">${e(emp)}</span></div></div>`}

function navItem(id,symbol,label,disabled=false){return `<button class="nav-item ${page===id?'active':''}" ${disabled?'disabled title="仅保留菜单入口，暂不制作页面内容"':`data-nav="${id}"`} aria-label="${label}" ${page===id?'aria-current="page"':''}><span class="symbol">${symbol}</span><span class="nav-label">${label}</span></button>`}
function navigation(){return `<div class="side-label">人力资源</div>${[['attendance','▦','考勤统计',navItem('rules','▤','补卡规则')+navItem('records','▦','打卡记录')+navItem('exceptions','◷','异常结果')+navItem('lock','▣','考勤锁定',true)],['schedule','▧','排班',navItem('groups','▧','考勤组')]].map(([id,symbol,label,items])=>`<section class="nav-group"><button class="parent" data-parent="${id}" aria-expanded="${expanded.has(id)}" aria-controls="nav-${id}" aria-label="${label}"><span class="symbol">${symbol}</span><span class="nav-label">${label}</span><span class="caret">${expanded.has(id)?'⌄':'›'}</span></button><div id="nav-${id}" ${expanded.has(id)?'':'hidden'}>${items}</div></section>`).join('')}`}

function table(head,rows,count,attrs=''){return `<div class="table-wrap"><table ${attrs}><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${head.length}" class="empty">暂无记录</td></tr>`}</tbody></table></div><div class="pagination"><span>共 ${count} 条记录</span><div class="flex"><span>每页 20 条</span><span class="muted">‹</span><span class="page-number">1</span><span class="muted">›</span></div></div>`}
function filter(label,control){return `<div class="filter"><label>${label}</label>${control}</div>`}
function select(label,items,id){return filter(label,`<select id="${id}" aria-label="${label}">${options([['','全部'],...items])}</select>`)}
function range(label){return filter(label,`<div class="date-range"><input type="date" aria-label="开始${label}" value="2026-10-20"><span class="muted">—</span><input type="date" aria-label="结束${label}" value="2026-10-26"></div>`)}
function filters(kind){const rule=kind==='rule',apps=kind==='apps';return `<div class="filters"><div class="filter search"><label>${rule?'规则名称':apps?'人员 / 工号 / 审批编号':'人员 / 工号'}</label><input aria-label="${rule?'规则名称':'人员搜索'}" placeholder="${rule?'搜索规则名称':apps?'输入姓名、工号或审批编号':'输入姓名或工号'}"></div>${rule?select('引用考勤组',groups,'filter-rule-group'):select('所属组织',orgs,'filter-org')}${rule?'':range(apps?'提交日期':kind==='raw'?'打卡日期':'考勤日期')}${['raw','effective'].includes(kind)?select('来源',sources,'filter-source'):''}${kind==='effective'?select('锁定状态',['未锁定','已锁定'],'filter-lock'):''}${kind==='raw'?select('打卡时区',['Asia/Bangkok','Asia/Kuala_Lumpur','待接口确认'],'filter-zone'):''}${apps?select('审批状态',['审批中','已通过','已退回','已撤回'],'filter-status'):''}${kind==='exceptions'?select('考勤组',groups,'filter-group'):''}<button class="primary" data-action="query">查询</button><button class="link" data-action="reset-filters">重置</button></div>`}
function rulesView(){return `<div class="panel">${filters('rule')}${table(['规则名称','适用部门','适用办理情形','次数限制','补卡时限','引用考勤组','状态','操作'],rules.map(r=>`<tr><td><strong>${r.name}</strong><span class="sub">${r.version} · ${r.date} 生效</span></td><td>${r.dept}</td><td>${r.situations}</td><td>${r.limit}</td><td>${r.deadline}</td><td>${r.groups}</td><td>${pill(r.active?'启用':'停用',r.active?'green':'')}</td><td><button class="link" data-rule="${r.id}" ${r.active?'':'disabled'}>编辑</button><button class="link" data-version="${r.id}">版本</button><button class="link" data-toggle="${r.id}" ${r.groups==='—'?'':'disabled title="被考勤组引用时不可启停（沿用原型口径）"'}>${r.active?'停用':'启用'}</button></td></tr>`).join(''),rules.length)}<div class="note">补卡规则决定能否申请；优先匹配员工当前部门，未匹配时查找上级部门。</div></div>`}
function recordsView(){return `<div class="panel"><div class="tabs" role="tablist" aria-label="打卡记录类型">${[['raw','原始记录','8'],['effective','有效打卡','10'],['apps','补卡审批记录','4']].map(([id,label,n])=>`<button class="tab ${recordTab===id?'active':''}" role="tab" aria-selected="${recordTab===id}" data-tab="${id}">${label}<span class="count">${n}</span></button>`).join('')}</div>${filters(recordTab)}<div class="toolbar"><div class="flex">${recordTab==='effective'?`<button class="primary" id="batch-edit" data-action="batch" ${selected.size?'':'disabled'}>批量编辑${selected.size?'（'+selected.size+'）':''}</button><button data-action="import">导入编辑</button>`:`<span class="tiny muted">${recordTab==='raw'?'来源记录逐笔展示，保留未选用及未关联排班记录':'按审批实例追踪，退回、撤回及重提保留流转记录'}</span>`}</div><div class="flex">${recordTab!=='apps'?'<button data-action="refresh">↻ 更新数据</button><button data-action="export">↓ 导出</button>':''}</div></div>${recordTab==='effective'?effectiveTable():recordTab==='raw'?rawTable():approvalTable()}<div class="note">${recordTab==='raw'?'人工订正与审批生效会新增来源记录，既有原始事实不作编辑。':recordTab==='effective'?'维度：员工＋班次时段。只允许编辑异常卡，跨日班次按唯一考勤归属日定位。':'审批结果与生效状态按页面示例展示，可点击编号查看申请详情。'}</div></div>`}
function cardTime(r,point){const isIn=point==='in',value=isIn?r.cin:r.cout,origin=isIn?r.inType:r.outType,flag=isIn?r.inFlag:r.outFlag;return `<span class="time ${flag?'red-text':''}">${value}</span><span class="sub">${origin}${flag?' · '+flag:''}${origin==='管理员编辑'?` <button class="link tiny" data-reason="${r.id}">订正原因</button>`:''}</span>`}

function rawTable(){return table(['员工','所属组织','来源','打卡时间','打卡时区','是否被选用','来源详情'],raw.map((r,i)=>`<tr><td>${person(r[0],r[1])}</td><td>${r[2]}</td><td>${pill(r[3])}</td><td class="time">${r[4]}</td><td>${r[5]==='待接口确认'?pill(r[5],'amber'):r[5]}</td><td>${pill(r[6],r[6]==='是'?'green':'')}</td><td><button class="link" data-raw="${i}">${r[7]}</button></td></tr>`).join(''),raw.length)}

function exceptionsView(){return `<div class="panel tab-strip"><div class="tabs" role="tablist" aria-label="异常结果视图">${[['results','异常结果'],['rules','异常规则']].map(([id,label])=>`<button role="tab" aria-selected="${exceptionTab===id}" class="tab ${exceptionTab===id?'active':''}" data-exception-tab="${id}">${label}</button>`).join('')}</div></div>${exceptionTab==='rules'?exceptionRulesView():`<div class="panel">${filters('exceptions')}<div class="toolbar"><span class="tiny muted">结果只读 · 员工＋班次时段</span><button data-action="export">↓ 导出所有字段</button></div>${table(['员工 / 组织','考勤组','考勤日期 / 班次','排班上班时间','排班下班时间',...metrics.map((m,i)=>m[0]+`<span class="sub">${i===6?'单位待确认':m[1]}</span>`),'计算状态'],effective.map(r=>`<tr><td>${person(r.name,r.emp)}<span class="sub">${r.org}</span></td><td>${r.group}</td><td>${r.date}<span class="sub">${r.shift}</span></td><td class="time">${r.start}</td><td class="time">${r.end}</td>${metrics.map((m,i)=>`<td class="${r.result&&Number(r.result[i])>0?'red-text bold':''}">${r.result?r.result[i]:'—'}</td>`).join('')}<td>${r.result?pill('已完成','green'):pill('异常规则配置缺失','amber')}</td></tr>`).join(''),effective.length)}<div class="note">未命中的已计算指标显示 0；配置缺失或未完成时展示原因。示例结果固定，不随其他操作重算。</div></div>`}`}

function rawDetail(i){const r=raw[i];openDialog('原始打卡记录详情',r[0]+' / '+r[1],`<dl class="detail-grid"><dt>姓名</dt><dd>${r[0]}</dd><dt>工号</dt><dd>${r[1]}</dd><dt>所属组织</dt><dd>${r[2]}</dd><dt>来源</dt><dd>${r[3]}</dd><dt>打卡时间</dt><dd>${r[4]}</dd><dt>打卡时区</dt><dd>${r[5]}</dd><dt>是否被选用</dt><dd>${pill(r[6],r[6]==='是'?'green':'')}</dd><dt>排班关联</dt><dd>${r[7]==='未关联排班'?'未关联排班':'已关联班次时段'}</dd></dl><div class="notice">其他接口返回字段待后端对接后补全，当前不预设字段名称。</div>`)}
function approvalDetail(id){const a=approvals.find(a=>a.id===id),r=effective.find(r=>r.id===a.record);openDialog('补卡审批详情',a.id,`<div class="flex between" style="margin-bottom:20px">${status(a.status)}<span class="tiny muted">第 ${a.round} 轮申请</span></div><dl class="detail-grid"><dt>申请人</dt><dd>${r.name} / ${r.emp}</dd><dt>所属组织</dt><dd>${r.org}</dd><dt>考勤日期</dt><dd>${r.date}</dd><dt>班次时段</dt><dd>${r.shift}</dd><dt>排班时间</dt><dd>${a.point==='上班'?r.start:r.end} · ${a.point}</dd><dt>原始打卡时间</dt><dd>${a.old}</dd><dt>订正时间</dt><dd>${a.corrected}</dd><dt>申请原因</dt><dd>${a.reason}</dd><dt>说明</dt><dd>${a.note}</dd><dt>提交时间</dt><dd>${a.submitted}</dd></dl><h3>审批流程</h3><div class="timeline"><div class="event"><strong>${r.name} 发起申请</strong><span class="sub">${a.submitted}</span></div><div class="event"><strong>OA 审批节点</strong><span class="sub">${a.status==='审批中'?'处理中':a.status} · 按预置流程模板流转</span></div>${a.round>1?'<div class="event"><strong>退回后重新提交</strong><span class="sub">同一申请编号继续追踪</span></div>':''}</div>`,role==='employee'&&['已退回','已撤回'].includes(a.status)?'<button class="primary" id="resubmit-application">重新提交</button>':'');if($('#resubmit-application'))$('#resubmit-application').onclick=()=>editCard([r.id],true,a.point==='上班'?'in':'out')}
function groupDetail(i){openDialog('考勤组基础信息',groups[i],`<dl class="detail-grid"><dt>考勤组</dt><dd>${groups[i]}</dd><dt>所属组织</dt><dd>${orgs[i]}</dd><dt>排班时区</dt><dd>${i?'Asia/Kuala_Lumpur':'Asia/Bangkok'}</dd><dt>状态</dt><dd>${pill('启用','green')}</dd></dl><div class="notice">本次原型仅呈现已有菜单与基础信息，不展示作废的规则关联配置。</div>`)}
function exceptionRuleDetail(){openDialog('异常规则详情','预置公共异常规则集 · 适用范围：不限',`<div class="notice">命中缺勤后，同时记缺勤和缺卡；迟到与早退可并存，分别统计时长和次数。</div>${table(['异常字段','单位','统计口径'],metrics.map(m=>'<tr>'+m.map(v=>`<td>${e(v)}</td>`).join('')+'</tr>').join(''),metrics.length,'class="dense-table" id="exception-fields"')}<div class="section-title">判定依据</div><p class="small muted">先根据排班、已生效请假、出差及免卡规则确定应打卡点，再判断是否缺失。</p><p class="small muted">单边缺卡形成的缺勤可与另一端的迟到或早退同时存在。</p><dl class="detail-grid"><dt>引用考勤组</dt><dd>${groups.join('、')}</dd></dl>`,'',true)}
function importDialog(step=0,fileName='',failure=false){const templateFields=['姓名','工号','考勤日期','班次','班次上班时间','班次下班时间','有效上班时间','有效下班时间','申请原因','说明'];const steps=`<div class="steps">${['下载模板','上传模板','确认导入'].map((s,i)=>`<div class="step ${i===step?'active':''}"><span>${i+1}</span>${s}</div>`).join('')}</div>`;let body,footer;
 if(step===0){body=`<div class="notice">导入编辑默认不走审批。按工号＋班次名称＋考勤日定位，姓名及班次时间用于核对；空白不覆盖已有值。</div><h3>导入模板</h3><p class="small muted">模板内容关联当前列表筛选条件。</p><div class="preview-tags" style="margin-bottom:20px">${templateFields.map(f=>pill(f)).join('')}</div><button id="template-download">↓ 下载导入模板</button><div class="section-title">填写说明</div><p class="small muted">仅覆盖有效上班时间、有效下班时间。存在多个时段无法唯一定位时，需返回列表逐条编辑。</p>`;footer='<button class="primary" id="import-next">下一步：上传模板</button>'}
 if(step===1){body=`<div class="notice">上传填写后的模板文件，进入导入结果预览。</div><div class="upload"><div class="upload-symbol">⇧</div><h3>上传模板文件</h3><p class="small muted">支持 .xlsx / .xls 文件的交互展示</p><input id="import-file" type="file" accept=".xlsx,.xls" aria-label="选择导入文件"><span class="sub" id="upload-file-name">${e(fileName||'尚未选择文件')}</span></div><div class="flex between" style="margin-top:17px"><span class="tiny muted">也可使用预设文件体验完整流程</span><button class="link" id="use-sample-file">使用示例文件</button></div>`;footer='<button id="import-back">上一步</button><button class="primary" id="import-next" '+(fileName?'':'disabled')+'>预览校验结果</button>'}
 if(step===2){body=`<div class="notice ${failure?'amber':''}">${failure?'预览失败状态：存在 1 条定位不唯一的记录，请修正后重新上传。':'预览成功状态：2 条记录通过，可确认导入。'}</div><div class="tiny muted" style="margin-bottom:17px">文件：${e(fileName||'有效打卡导入模板.xlsx')}</div>${table(['文件行','姓名 / 工号','覆盖内容','校验结果'],`<tr><td>2</td><td>林悦 / TH001</td><td>有效下班时间</td><td>${pill('通过','green')}</td></tr><tr><td>3</td><td>${failure?'刘洋 / TH008':'陈宇 / TH002'}</td><td>有效上班时间</td><td>${failure?pill('定位不唯一','red'):pill('通过','green')}</td></tr>`,2)}${failure?'<p class="small red-text">第 3 行：工号＋班次＋考勤日对应多个时段，请逐条编辑。</p><button id="download-import-errors">下载错误明细</button>':''}<div class="flex between" style="margin-top:18px"><span class="tiny muted">校验结果为预设状态示例</span><button class="link" id="toggle-import-state">${failure?'查看通过示例':'查看失败示例'}</button></div>`;footer='<button id="import-back">返回上传</button><button class="primary" id="confirm-import" '+(failure?'disabled':'')+'>确认导入</button>'}
 openDialog('导入编辑有效卡','逐步预览导入操作',steps+body,footer,true);
 if($('#template-download'))$('#template-download').onclick=()=>notify('已展示模板下载操作（示例）');
 if($('#import-back'))$('#import-back').onclick=()=>importDialog(step-1,fileName);
 if($('#import-next'))$('#import-next').onclick=()=>importDialog(step+1,step===1?$('#upload-file-name').textContent:fileName);
 if($('#use-sample-file'))$('#use-sample-file').onclick=()=>{$('#upload-file-name').textContent='有效打卡导入模板.xlsx';$('#import-next').disabled=false};
 if($('#import-file'))$('#import-file').onchange=ev=>{const f=ev.target.files[0];$('#upload-file-name').textContent=f?f.name:'尚未选择文件';$('#import-next').disabled=!f};
 if($('#toggle-import-state'))$('#toggle-import-state').onclick=()=>importDialog(2,fileName,!failure);
 if($('#confirm-import'))$('#confirm-import').onclick=()=>success('导入操作完成','已完成模板上传、校验预览与确认导入的点击流程。');
 if($('#download-import-errors'))$('#download-import-errors').onclick=()=>notify('已展示错误明细下载操作（示例）');
}
function refreshDialog(){const rawMode=recordTab==='raw';openDialog('更新数据',rawMode?'重新获取指定考勤期间的原始打卡数据':'根据原始记录、加班、请假等单据重新计算有效卡',`<form id="refresh-form"><div class="form-grid">${fieldInput('开始考勤日期','refresh-from','2026-10-20','date',true)}${fieldInput('结束考勤日期','refresh-to','2026-10-26','date',true)}</div><div class="notice">${rawMode?'当前页：原始记录。确认后展示数据同步操作的反馈。':'当前页：有效打卡。确认后展示重新取卡与计算操作的反馈。'}</div></form>`,`<button class="primary" id="confirm-refresh">确认更新</button>`,false,true);$('#confirm-refresh').onclick=()=>{if(!$('#refresh-form').reportValidity())return;success('更新操作已提交','已完成更新数据交互，原型不进行同步或重新计算。')}}
function exportDialog(){const count=page==='exceptions'?'10':recordTab==='raw'?'8':'10';openDialog('导出列表数据','按当前筛选范围导出',`<dl class="detail-grid"><dt>导出内容</dt><dd>${page==='exceptions'?'异常结果全部字段':recordTab==='raw'?'原始记录列表字段':'有效打卡列表字段'}</dd><dt>导出范围</dt><dd>当前筛选及授权范围</dd><dt>示例记录</dt><dd>${count} 条</dd></dl><p class="small muted">此处展示导出确认与完成反馈。</p>`,`<button class="primary" id="confirm-export">确认导出</button>`,false,true);$('#confirm-export').onclick=()=>success('导出操作已完成','已展示当前筛选范围的导出确认流程。')}
function renderEmployee(){const empty=currentDay!==21&&currentDay!==22&&currentDay!==20;const dayRows=currentDay===21?[effective[0],effective[3]]:currentDay===20?[{...effective[7],name:'林悦',emp:'TH001',date:'2026-10-20',start:'2026-10-20 09:00',end:'2026-10-20 13:00',id:'E8',shift:'两段班 · 时段 1'},{...effective[8],name:'林悦',emp:'TH001',id:'E9',date:'2026-10-20'}]:[{...effective[5],name:'林悦',emp:'TH001',id:'E6',date:'2026-10-22',cin:'2026-10-22 09:00',cout:'2026-10-22 18:02'}];$('#app').innerHTML=`<header class="topbar"><div class="breadcrumb">员工服务　/　<span>我的考勤</span></div><div class="flex"><span class="prototype">员工端 · 可点击原型</span><button class="link tiny" data-action="about">页面说明</button><button data-action="admin">返回管理端</button></div></header><div class="employee-shell"><div class="phone"><div class="phone-header"><div class="phone-status"><span>9:41</span><span>◖◖◖　▰</span></div><div class="phone-title">我的考勤</div></div><div class="phone-profile"><h2>林悦 <span class="tiny" style="font-weight:400;margin-left:4px">TH001</span></h2><p>泰国 / 曼谷运营中心 · Asia/Bangkok</p></div><div class="phone-section"><div class="calendar-top"><button class="link" data-action="previous-month" aria-label="上个月">‹</button><strong>2026 年 10 月</strong><button class="link" data-action="next-month" aria-label="下个月">›</button></div><div class="week">${['一','二','三','四','五','六','日'].map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar">${'<span></span>'.repeat(3)}${Array.from({length:31},(_,i)=>`<button class="${i+1===currentDay?'active':''} ${[20,21].includes(i+1)?'has-exception':''}" data-day="${i+1}" aria-label="10 月 ${i+1} 日">${i+1}</button>`).join('')}</div><div class="day-title"><strong>10 月 ${currentDay} 日 · 当日详情</strong><span>${empty?pill('暂无排班'):currentDay===22?pill('正常','green'):pill('存在异常','red')}</span></div>${empty?'<div class="empty" style="padding:28px 0">暂无考勤记录</div>':dayRows.map((r,i)=>`<div class="shift-card"><div class="shift-label">${r.shift}</div><div class="tiny muted">${r.start.slice(11)} — ${r.id==='E4'?'次日 ':''}${r.end.slice(11)}<br>考勤归属日：2026-10-${String(currentDay).padStart(2,'0')}</div><div class="punch-cards">${[['in','上班',r.cin,r.inFlag],['out','下班',r.cout,r.outFlag]].map(([p,label,time,flag])=>`<div class="punch-card">${label}打卡<strong class="${flag?'red-text':''}">${time.includes(' ')?time.slice(11):time}</strong>${flag?pill(flag,'red'):'<span class="tiny">正常</span>'}<div><button class="link" data-employee-apply="${r.id}" data-point="${p}" ${flag?'':'disabled'}>申请补卡</button></div></div>`).join('')}</div></div>`).join('')}<button style="width:100%;margin-top:8px" data-action="my-requests">查看我的补卡申请</button></div><div class="phone-bottom"><span>⌂　首页</span><span class="active">◷　我的考勤</span><span>♙　我的</span></div></div><aside class="employee-aside"><div class="aside-card"><div class="tiny muted" style="letter-spacing:2px;margin-bottom:9px">员工服务</div><h2>从异常卡点发起补卡</h2><p>选择考勤日期，进入当日班次时段，点击异常卡点的“申请补卡”，填写订正时间与申请原因。</p><div class="preview-tags">${pill('固定本人','blue')}${pill('一次一个卡点','blue')}${pill('提交 OA 审批','blue')}</div></div><div class="aside-card"><h3>可体验的日期</h3><p>10 月 20 日：多时段班次<br>10 月 21 日：迟到、缺卡及跨日夜班<br>10 月 22 日：正常打卡<br>其他日期：空记录状态</p></div><div class="tiny muted">本页为员工端页面与表单的点击演示，<br>不进行异常判断、审批流转或次数计算。</div></aside></div>`;bindMain()}
function myRequests(){openDialog('我的补卡申请','林悦 / TH001',`<div class="panel" style="border:none">${table(['审批编号','考勤日期','目标卡点','审批状态','操作'],`<tr><td class="mono">BK20261020003</td><td>2026-10-21</td><td>下班</td><td>${status('已退回')}</td><td><button class="link" id="employee-request-detail">查看</button></td></tr>`,1)}</div>`);$('#employee-request-detail').onclick=()=>approvalDetail('BK20261020003')}
function aboutDialog(){openDialog('原型说明','基于飞书 PRD 当前修订内容制作',`<dl class="detail-grid"><dt>来源文档</dt><dd><a href="https://jtexpress.feishu.cn/wiki/Bh4bwjpi1i4gWhkTk7TcmWyKnBe" target="_blank" rel="noopener">打卡记录和异常处理PRD ↗</a></dd><dt>文档修订号</dt><dd>882</dd><dt>读取日期</dt><dd>2026-10-26</dd><dt>原型范围</dt><dd>页面跳转、Tab 切换、表单联动、弹窗、导入步骤与操作反馈</dd><dt>数据方式</dt><dd>固定示例数据，无计算、持久化、文件解析或接口调用</dd></dl><h3>页面与入口</h3><p class="small muted">考勤统计：补卡规则、打卡记录、异常结果、考勤锁定（占位）。<br>排班：考勤组基础信息；不提供已作废的规则关联配置。<br>异常规则列表与详情：在“异常结果”内切换查看。<br>员工端：我的考勤 → 当日详情 → 异常卡点 → 补卡申请。</p><h3 style="margin-top:25px">文档待确认项</h3><div class="notice amber">“缺勤天数”的单位栏写“小时”，统计口径写“天”；原型保留字段名称并标记单位待确认。</div><p class="small muted">原始记录的接口扩展字段与部分来源时区仍待对接，不虚构字段。锁定后审批写入、时效等后端口径不在本次点击原型中执行。</p>`)}
document.addEventListener('keydown',ev=>{const root=$('#sub-layer').innerHTML?$('#sub-layer'):$('#layer');if(!root.innerHTML)return;if(ev.key==='Escape'){$('#sub-layer').innerHTML?closeSub():closeDialog();return}if(ev.key==='Tab'){const controls=Array.from(root.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')).filter(el=>el.getClientRects().length);const first=controls[0],last=controls.at(-1);if(ev.shiftKey&&document.activeElement===first){last?.focus();ev.preventDefault()}else if(!ev.shiftKey&&document.activeElement===last){first?.focus();ev.preventDefault()}}});
render();
</script>
