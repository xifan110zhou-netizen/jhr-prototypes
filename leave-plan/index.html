function renderReading(){const transitions=[['请假提交成功','校验后直接扣减可用额度'],['请假审批通过','仅更新审批状态，不重复扣减'],['请假退回未关单','保留原扣减，可沿原实例重提'],['请假撤回 / 退回后关单','返还原批次；原额度过期则同时记录返还和失效'],['销假提交 / 撤回 / 退回 / 关单','均不返还原请假额度'],['销假通过','按批准区间返还原批次'],['延期保留','仅延长有效期，不增加额度'],['到期失效','减少到期未用余额']];$('#content').innerHTML=heading('逻辑与原型核对','基于更新后的假期方案画布，逐项核对文字、便签、图片及控件。')+`<div class="reading"><div class="card">${section('业务关系',`<div class="choices"><span class="choice">假期类别</span><span class="choice">→ 假期方案：请假 / 发放 / 表单 / 流程</span><span class="choice">→ 假期组</span><span class="choice">→ 适用组织与员工</span></div><p class="muted" style="margin-top:16px">一个方案定义一个假别。假期组选择多个假别对应的方案；同一组织、同一假别只能匹配一个方案。授权范围用于管理权限，适用组织用于员工匹配。</p>`)}</div><div class="card">${section('类别配置矩阵',table(['类别','发放配置','有效期','余额'],[['自定义类别（年假、病假等）','手动 / 每年 / 每月','手动：永久或当年年底；自动：另支持发放后指定时长','天'],['调休假','不展示发放规则，来自加班转调休','永久 / 年底 / 发放后指定时长','小时'],['产假 / 陪产假 / 生育假','仅手动发放','永久 / 年底 / 发放后指定时长','天'],['事假','无假期规则','不适用','不控制、不展示']].map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join(''))) }</div><div class="card">${section('额度状态变化',table(['事件','额度处理'],transitions.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')))}</div><div class="card">${section('发放与申请联动',`<ul><li>按年发放本年，按月发放上月。年度折算按当年实际自然日数计算；月度折算按上月实际自然日数计算。</li><li>发放对象可限制转正、性别和年龄；可用条件与发放对象分开设置。</li><li>司龄额度取归属期起点所在区间，不在一个发放期间内跨区间折算。</li><li>最小请假单位控制日期 / 半天 / 时间控件；最大最小时长联动天 / 小时，步长等于最小时长。</li><li>请假提交校验方案资格、可用条件、时长、区间重叠、优先级、额度有效期、材料及关联流程。</li><li>证明材料采用严格“大于”阈值必填，支持文本、数字、单选、多选和附件。系统字段不可删除。</li><li>事假虽然不控制余额，仍要校验优先级、时长、材料、重叠与流程。</li><li>工作地时区、方案规则、扣减批次及处理前后余额随审批实例保存。</li></ul>`)}</div><div class="card">${section('原型待确认与本地演示口径',`<div class="info warn">以下内容不作为已确认需求，demo 为验证联动采用明确的临时口径。</div><ol><li><b>“组织关联唯一假别”：</b>按同组织、同假别只对应一个方案实现，允许同组织配置不同假别。</li><li><b>天 / 半天与默认最小时长：</b>按天最少 1 天、按半天最少 0.5 天、按小时最少 1 小时；原型同时出现“天：0.5”，需最终确认。</li><li><b>有效期边界：</b>有效起止日期包含当天；按请假日期匹配有效批次。跨有效期区间逐日分配。</li><li><b>年度折算计数：</b>入职 / 转正当日计入；年度分母按实际 365 或 366 天。</li><li><b>每月 29—31 日：</b>短月补发日期尚无说明，demo 暂开放 1—28 日。</li><li><b>优先级：</b>更高优先级假别在申请区间有可用额度时阻止提交，暂不做自动混合扣减。</li><li><b>退回未关单：</b>由于保留扣减，demo 继续占用区间；重提不修改原单区间。</li><li><b>代请假 / 代销假、考勤锁定、OA 关单入口、审批详情 H5：</b>原型明确待确认，未擅自实现权限或真实对接。</li><li><b>过期余额延期：</b>仅对尚未过期批次延期；已过期余额是否允许恢复需另行确认。</li><li><b>原型末尾“异常流”：</b>文字未完整描述，demo 不补写生产异常补偿规则。</li></ol>`)}</div><div class="card">${section('本期边界',`<p>不做跨司龄区间折算、试用期停发后转正补足、月度尾差补差、人事信息修改后历史追溯、离职后扣回提前发放额度。</p><p class="muted">本地 demo 不连接真实 OA、排班、人事或通知服务。示例员工、余额和日历为演示数据。上传控件只记录文件名，不发送文件；多语言描述在本地维护。</p>`)}</div><div class="card">${section('原型资料说明',`<p class="muted">此分享版保留交互功能、逻辑梳理和待确认事项。原始原型截图未随网页发布。</p>`)}</div></div>`}

 if(a==='removeField'){draft.fields.splice(Number(d.index),1);renderEditor();return}if(a==='fieldUp'||a==='fieldDown'){const i=Number(d.index),j=i+(a==='fieldUp'?-1:1);[draft.fields[i],draft.fields[j]]=[draft.fields[j],draft.fields[i]];renderEditor();return}

 if(a==='executeGrant'){const errors=E.validateRule(D,draft);if(errors.length){error(errors);return}if(!rule(draft.id)||JSON.stringify(rule(draft.id))!==JSON.stringify(draft)){error('请先保存方案，再执行自动发放。试算可使用未保存配置。');return}E.runGrant(D,rule(draft.id),simulationEmployee,simulationDate);persist();grantPreview();toast('发放完成，已新增批次及变更记录');return}

 if(a==='openFlows'){modal('共用流程关联',`<p>销假流程：${esc(D.settings.cancelFlow)||'未关联'}</p><p>申诉流程：${esc(D.settings.appealFlow)||'未关联'}</p><p class="muted">可保存当前方案后，在「更多配置」修改。</p>`);return}

 if(a==='priorityRemove'){D.settings.priority.splice(Number(d.index),1);persist();render();return}if(a==='priorityAdd'){if($('#priority-new').value)D.settings.priority.push($('#priority-new').value);persist();render();return}
 if(a==='advanceDate'){const when=$('#demo-date').value;if(!when)throw Error('请选择业务日期');E.advance(D,when);persist();render();toast('业务日期已更新，过期未用余额已处理');return}

 if(a==='importModal'){importModal();return}if(a==='saveImport'){const lines=$('#import-text').value.trim().split(/\r?\n/).filter(Boolean);if(!lines.length)throw Error('请填写导入内容');const temp=E.clone(D);lines.forEach((line,i)=>{let [employee,category,amount,start,end,year,...reason]=line.split(',').map(v=>v.trim());try{if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||end&&!/^\d{4}-\d{2}-\d{2}$/.test(end))throw Error('日期格式为 YYYY-MM-DD');if(!reason.join(',').trim())throw Error('原因必填');E.grant(temp,{employee,category,amount:Number(amount),start,end,year:Number(year),source:'导入额度',reason:reason.join(',')})}catch(err){throw Error(`第 ${i+1} 行：${err.message}`)}});D=temp;persist();closeModal();render();toast(`已导入 ${lines.length} 条额度记录`);return}
 if(a==='recordKind'){recordKind=d.kind;renderRecords();return}if(a==='recordDetail'){recordDetail(d.id);return}if(a==='recordEvent'){E.event(D,d.id,d.event);persist();render();recordDetail(d.id);toast('审批事件已处理');return}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('#modal .dialog')){const els=[...$('#modal').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea,a[href]')].filter(e=>e.offsetParent!==null);if(!els.length)return;const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

function sanitizeHTML(value){const template=document.createElement('template');template.innerHTML=value;for(const el of [...template.content.querySelectorAll('*')]){if(!['B','STRONG','I','EM','U','BR','P','DIV','UL','OL','LI'].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent||''));continue}for(const attr of [...el.attributes])el.removeAttribute(attr.name)}return template.innerHTML}
